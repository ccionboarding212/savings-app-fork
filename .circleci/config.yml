# CircleCI Configuration for savings-app
# Optimized for performance with workspace persistence and parallel execution
version: 2.1
orbs:
  node: circleci/node@5
jobs:
  install-dependencies:
    # Install dependencies once and persist to workspace
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - .
  test-node:
    # Run tests using persisted workspace
    executor: node/default
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          command: npm test --passWithNoTests
      - store_test_results:
          path: ./test-results
  build-node:
    # Build project using persisted workspace
    executor: node/default
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Build project
          command: npm run build
      - run:
          name: Create artifacts directory
          command: mkdir -p ~/artifacts
      - run:
          name: Copy artifacts
          command: cp -R dist ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
workflows:
  build-and-test:
    jobs:
      - install-dependencies
      - test-node:
          requires:
            - install-dependencies
      - build-node:
          requires:
            - install-dependencies
